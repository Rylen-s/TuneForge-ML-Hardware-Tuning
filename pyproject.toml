[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlforge"
version = "0.1.0"
description = "A compact training-recipe benchmark for sequential control policies"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
controlforge = "controlforge.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
